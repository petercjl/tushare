[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tushare-local-environment"
version = "0.1.0"
description = "Tushare data and local backtest runtime"
requires-python = ">=3.11"
dependencies = ["tushare==1.4.29", "pandas", "numpy", "pyarrow", "openpyxl", "plotly", "mcp==2.3.0", "pyyaml"]
[project.scripts]
tushare-env = "tushare_env.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qt_research" = ["dashboard.html"]
