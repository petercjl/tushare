function backtests(sid){if(sid&&!catalog.strategies.some(s=>s.id===sid))throw Error('未找到这个策略');let rows=catalog.runs.filter(r=>(!sid||r.strategy_id===sid)&&(!runFilter.platform||r.platform===runFilter.platform)&&(!runFilter.status||r.status===runFilter.status)&&(`${runName(r)} ${strategyName(r.strategy_id)}`).toLowerCase().includes(runFilter.text.toLowerCase())).sort((a,b)=>String(b.started).localeCompare(String(a.started)));$('main').innerHTML=(sid?crumb(sid):'')+heading(sid?strategyName(sid):'全部回测',sid?'历史回测 · 点击名称进入详情，勾选记录比较收益曲线。':'跨策略浏览已归档的回测记录。')+`<div class="panel"><div class="toolbar"><input id="run-search" type="search" value="${esc(runFilter.text)}" placeholder="搜索回测 / 策略"><select id="platform"><option value="">所有平台</option>${['local','joinquant'].map(k=>`<option value="${k}" ${k===runFilter.platform?'selected':''}>${labels[k]}</option>`).join('')}</select><select id="status"><option value="">所有状态</option>${['completed','warning','failed','running'].map(k=>`<option value="${k}" ${k===runFilter.status?'selected':''}>${labels[k]}</option>`).join('')}</select><span class="muted">共 ${rows.length} 次回测</span><button id="compare" class="primary right">回测对比（${chosen.size}）</button></div><div class="scroll"><table><thead><tr><th><input id="select-visible" type="checkbox" aria-label="选择当前列表全部回测"></th><th>回测名称</th><th>记录时间</th><th>回测区间</th><th class="numeric">初始资金</th><th class="numeric">策略收益</th><th class="numeric">基准收益</th><th class="numeric">最大回撤</th><th>状态</th><th>数据验收</th></tr></thead><tbody>${rows.map(r=>{const m=metrics(r);return `<tr><td><input data-check="${esc(r.id)}" type="checkbox" aria-label="选择 ${esc(runName(r))}" ${chosen.has(r.id)?'checked':''}></td><td><a class="name" href="#/runs/${enc(r.id)}">${esc(runName(r))}</a><span class="sub">${labels[r.platform]||esc(r.platform)}${sid?'':' · '+esc(strategyName(r.strategy_id))}</span></td><td class="muted">${time(r.started)}</td><td>${date(r.params.start)}<span class="sub">至 ${date(r.params.end)}</span></td><t $('trade-view').onchange=()=>{view=$('trade-view').value;page=0;load()};$('trade-group').onchange=()=>{groupDays=$('trade-group').checked;renderTable()};document.querySelectorAll('[data-column]').forEach(b=>b.onchange=()=>{b.checked?visible.add(b.dataset.column):visible.delete(b.dataset.column);renderTable()});$('trade-limit').onchange=()=>{limit=Number($('trade-limit').value);page=0;load()};$('trade-search').onclick=()=>{filters={start:$('trade-start').value,end:$('trade-end').value,side:$('trade-side').value,keyword:$('trade-keyword').value};page=0;load()};$('trade-keyword').onkeydown=e=>{if(e.key==='Enter')$('trade-search').click()};$('trade-reset').onclick=()=>{for(const id of ['trade-start','trade-end','trade-keyword','trade-side'])$(id).value='';filters={start:'',end:'',side:'',keyword:''};page=0;load()};if(r.platform==='joinquant')$('trade-view').querySelector('option[value=fill]').disabled=true;await load();if(token!==generation)return;if(xlsx){try{const data=await api('/api/transactions?id='+enc(r.id)+'&sheet='+enc('成交')+'&limit=1');if(token!==generation)return;$('trade-view').insertAdjacentHTML('beforeend',`<optgroup label="其他账本">${data.sheets.filter(s=>s!=='成交').map(s=>`<option value="ledger:${esc(s)}">${esc(s)}</option>`).join('')}</optgroup>`)}catch(e){error(e)}}}

async function detail(id,tab,token){const r=await api('/api/run?id='+enc(id));if(token!==generation)return;const tabs={overview:'收益概况',trades:'交易明细',logs:'回测日志',code:'策略代码',params:'回测参数'};if(!tabs[tab])tab='overview';$('main').innerHTML=crumb(r.strategy_id,r)+heading(runName(r),'')+`<div class="summary"><span>${esc(strategyName(r.strategy_id))}</span><span class="dot">|</span><span>${labels[r.platform]||esc(r.platform)}</span><span>${date(r.params.start)} — ${date(r.params.end)}</span><span>初始资金 ${money(r.params.initial_cash)} 元</span><span class="badge ${esc(r.status)}">${esc(labels[r.status]||r.status)}</span>${validity(r)}</div>${r.valid===0?`<div class="notice">这次回测有数据或执行告警（错误数：${r.errors??'未记录'}），数据有效性待验证。结合回测日志与对照研究评估收益。</div>`:''}${r.error?`<pre class="error">${esc(r.error)}</pre>`:''}<div class="panel"><div class="tabs">${Object.entries(tabs).map(([key,name])=>`<a class="${key===tab?'active':''}" href="#/runs/${enc(id)}?tab=${key}">${name}</a>`).join('')}</div><div class="body" id="detail-body"></div></div>`;document.title=runName(r)+' · 量化研究台';if(tab==='overview'){await overview(r,token)}else if(tab==='trades'){await tradePage(r,token)}else if(tab==='logs'){const logs=r.artifacts.filter(a=>/backtest\.log$|logs\.human\.txt$|logs\.raw\.txt$|events\.jsonl$|logs\.audit\.jsonl$/.test(a.name));$('detail-body').innerHTML=`<div class="toolbar"><label>日志文件 <select id="log-select">${logs.map((a,i)=>`<option value="${i}">${esc(a.name)}</option>`).join('')}</select></label><a id="log-open" target="_blank" rel="noopener">打开完整日志</a></div><p class="muted">按原文件显示；错误记录保留在日志中。</p><pre id="log-text">读取中…</pre>`;const load=async()=>{const a=logs[Number($('log-select').value)];if(!a){$('log-text').textContent='这个回测尚未归档日志';return}const value=await textFile(artifactURL(r,a));if(token!==generation)return;$('log-open').href=artifactURL(r,a);$('log-text').textContent=value.length>180000?value.slice(0,180000)+'\n…预览到此结束，请打开完整日志。':value};$('log-select').onchange=()=>load().catch(error);await load()}else if(tab==='code'){const v=r.version;$('detail-body').innerHTML=`<p class="muted">这次回测归档的策略代码快照</p><pre id="code-text">读取中…</pre>`;if(v?.code_path){const value=await textFile('/api/code?id='+enc(r.version_id));if(token===generation)$('code-text').textContent=value}else $('code-text').textContent='历史策略代码未确认。请查看参数页的来源记录。'}else{$('detail-body').innerHTML=`<div class="params">${[['策略',strategyName(r.strategy_id)],['平台',labels[r.platform]||r.platform],['运行频率',r.params.frequency||'未记录'],['回测开始',date(r.params.start)],['回测结束',date(r.params.end)],['初始资金',money(r.params.initial_cash)+' 元'],['记录时间',time(r.started)],['数据错误数',r.errors??'未记录'],['状态',labels[r.status]||r.status],['数据验收',r.valid===0?'待验证':r.valid===1?'通过本地检查':'未验收']].map(([label,value])=>`<div><span>${label}</span><b>${esc(value)}</b></div>`).join('')}</div><details><summary>完整参数与数据来源</summary><pre>${esc(JSON.stringify(r.params,null,2))}</pre></details><details><summary>归档标识与代码版本</summary><pre>${esc(JSON.stringify({run_id:r.id,strategy_id:r.strategy_id,version:r.version_id,code_hash:r.version?.code_hash,output:r.out},null,2))}</pre></details>${downloads(r)}`}}
async function comparison(ids,token){if(ids.length<2||ids.length>5)throw Error('对比需要 2 至 5 次回测');const rows=ids.map(id=>catalog.runs.find(r=>r.id===id));if(rows.some(r=>!r))throw Error('未找到所选回测');const key=r=>JSON.stringify([date(r.params.start),date(r.params.end),r.params.initial_cash]),differ=new Set(rows.map(key)).size>1;$('main').innerHTML=`<div class="crumb"><a href="#/runs">全部回测</a><span>/</span><span>回测对比</span></div>`+heading('回测对比','将所选回测的累计收益放在同一条时间轴上。')+`<div class="notice">${differ?'所选区间或初始资金不同，曲线只用于展示，不能直接归因比较。':'所选区间和资金相同；执行模型、数据来源和指标口径仍需核对。'}${rows.some(r=>r.valid===0)?' 包含有数据告警的回测结果。':''}</div><div class="panel"><div class="body"><div id="chart" class="chart"></div></div><div class="scroll"><table><thead><tr><th>回测</th><th>区间</th><th class="numeric">资金</th><th class="numeric">收益</th><th class="numeric">最大回撤</th><th>数据验收</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="#/runs/${enc(r.id)}">${esc(runName(r))}</a><span class="sub">${labels[r.platform]||esc(r.platform)}</span></td><td>${date(r.params.start)} — ${date(r.params.end)}</td><td class="numeric">${money(r.params.initial_cash)}</td><td class="numeric">${result(metrics(r).strategy_return)}</td><td class="numeric">${pct(metrics(r).max_drawdown)}</td><td>${validity(r)}</td></tr>`).join('')}</tbody></table></div></div>`;await draw(ids,token)}
function savedComparisons(){ $('main').innerHTML=heading('对照研究','已保存的跨平台对照报告，包含数据核对、目标一致性与成交差异分析。')+`<div class="panel"><div class="scroll"><table><thead><tr><th>研究报告</th><th>回测区间</th><th class="numeric">初始资金</th><th class="numeric">目标差异天数</th><th>操作</th></tr></thead><tbody>${catalog.comparisons.map((c,i)=>`<tr><td><span class="name">S02 · 聚宽与本地对照 ${catalog.comparisons.length-i}</span><span class="sub">${esc(c.out.split('/').pop())}</span></td><td>${date(c.summary.start)} — ${date(c.summary.end)}</td><td class="numeric">${money(c.summary.initial_cash)}</td><td class="numeric">${c.summary.target_mismatch_days??'—'}</td><td><a href="/comparison?id=${enc(c.id)}" target="_blank" rel="noopener">查看研究报告 →</a></td></tr>`).join('')}</tbody></table></div>${catalog.comparisons.length?'':'<div class="empty">尚无对照研究</div>'}</div>`}
async function render(){const token=++generation;$('message').textContent='';try{const {parts:p,query:q}=route();document.title='量化研究台';for(const key of ['strategies','runs','comparisons'])$('nav-'+key).classList.toggle('active',p[0]===key||(p[0]==='compare'&&key==='runs'));if(p[0]==='strategies'&&p[1])backtests(p[1]);else if(p[0]==='runs'&&p[1])await detail(p[1],q.get('tab')||'overview',token);else if(p[0]==='runs')backtests();else if(p[0]==='compare')await comparison((q.get('ids')||'').split(',').filter(Boolean),token);else if(p[0]==='comparisons')savedComparisons();else strategies()}catch(e){if(token===generation)error(e)}}
async function load(){try{catalog=await api('/api/catalog');const ids=new Set(catalog.runs.map(r=>r.id));chosen=new Set([...chosen].filter(id=>ids.has(id)));await render()}catch(e){error(e)}}
$('refresh').onclick=load;window.addEventListener('hashchange',()=>{if(catalog)render()});load();
</script></html>
